# Continuous integration: the full daily test gate
---
name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-gate:
    name: Test gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json

      # Installs dependencies and runs the Pi Durable postinstall patch.
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run test gate
        run: npm run test:gate

      - name: Upload test reports
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-reports
          retention-days: 14
          if-no-files-found: warn
          path: |
            test-results/
            coverage/
            playwright-report/
